name: Feature request
description: Suggest a new capability or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and what makes it hard with the current API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the API could look. Alternatives you considered are welcome too.
