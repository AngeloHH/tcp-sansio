name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: A minimal script, ideally using two in-memory stacks like `examples/loopback.py`.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tcp-sansio version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "CPython 3.13 on Windows 11"
    validations:
      required: true
